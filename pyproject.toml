[project]
name = "dspy-base-lm"
version = "0.1.0"
description = "A typed, provider-neutral foundation for building custom DSPy language models."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aaron Morris", email = "35127085+aaronmorris-dev@users.noreply.github.com" }]
keywords = ["dspy", "llm", "custom-lm", "baselm", "provider", "ai"]
classifiers = [
  "Operating System :: OS Independent",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["dspy>=3.3,<3.4", "pydantic>=2.0", "typing-extensions>=4.12"]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/aaronmorris-dev/dspy-base-lm"
Repository = "https://github.com/aaronmorris-dev/dspy-base-lm.git"
Issues = "https://github.com/aaronmorris-dev/dspy-base-lm/issues"
Changelog = "https://github.com/aaronmorris-dev/dspy-base-lm/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "basedpyright>=1.31.0",
  "httpx>=0.27.0",
  "poethepoet>=0.36.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
  "usechange>=0.1.44",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples/codex"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
include = ["src", "examples"]
executionEnvironments = [{ root = "examples/codex", extraPaths = ["examples/codex"] }]
# DSPy ships typed source but does not currently include a `py.typed` marker.
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
# DSPy 3.3 declares the legacy `forward(prompt, messages, **kwargs)` signature on
# BaseLM; the typed `forward(request)` contract intentionally differs during the
# upstream migration.
reportIncompatibleMethodOverride = "none"

[tool.poe.tasks]
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
typecheck = "basedpyright"
release = "usechange release"
check = ["lint", "typecheck", "test"]
