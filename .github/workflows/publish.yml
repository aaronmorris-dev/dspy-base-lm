name: "Publish"

on:
  release:
    types: [published]

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Python 3.10
        run: uv python install 3.10
      - name: Verify version matches tag
        run: |
          VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG=${GITHUB_REF#refs/tags/v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "Error: pyproject.toml version ($VERSION) does not match tag ($TAG)"
            exit 1
          fi
          echo "Version check passed: $VERSION"
      - name: Build
        run: uv build
      # Check that basic features work and no crucial file is missing
      - name: Verify built wheel
        run: uv run --isolated --no-project --with dist/*.whl tests/test_packaging.py
      - name: Verify source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/test_packaging.py
      - name: Publish
        run: uv publish
